<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production AI Streaming Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .cursor-blink::after {
            content: '▍';
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-6 font-sans">
    
    <div class="max-w-3xl w-full space-y-6">
        <!-- Header -->
        <header class="border-b border-slate-800 pb-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-indigo-400 bg-clip-text text-transparent">
                    AI Streaming Engine
                </h1>
                <p class="text-xs text-slate-400 mt-1">FastAPI • Server-Sent Events (SSE) • Redis Cache • Rate Limiting</p>
            </div>
            <a href="/api/v1/docs" target="_blank" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-400 font-mono border border-slate-700 transition">
                API Docs / Swagger →
            </a>
        </header>

        <!-- Metrics Banner -->
        <div class="grid grid-cols-3 gap-3 text-center">
            <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-800">
                <span class="text-xs text-slate-400 block">Protocol</span>
                <span class="text-sm font-semibold text-cyan-400">SSE (text/event-stream)</span>
            </div>
            <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-800">
                <span class="text-xs text-slate-400 block">Cache Status</span>
                <span id="cache-badge" class="text-sm font-semibold text-slate-400">Idle</span>
            </div>
            <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-800">
                <span class="text-xs text-slate-400 block">Time to First Token</span>
                <span id="ttft-display" class="text-sm font-semibold text-indigo-400">-- ms</span>
            </div>
        </div>

        <!-- Chat Output Box -->
        <div class="bg-slate-900 rounded-2xl border border-slate-800 p-5 min-h-[260px] max-h-[400px] overflow-y-auto space-y-4">
            <div id="output" class="text-sm leading-relaxed text-slate-200 whitespace-pre-wrap">Type a prompt below to see real-time asynchronous streaming with Redis caching...</div>
        </div>

        <!-- Prompt Input Form -->
        <form id="chat-form" class="space-y-3">
            <div class="flex gap-2">
                <input 
                    type="text" 
                    id="prompt-input" 
                    placeholder="Ask anything (e.g. Explain how async event loops work)..." 
                    class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500 transition text-slate-100 placeholder-slate-500"
                    required
                />
                <button 
                    type="submit" 
                    id="submit-btn" 
                    class="bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 px-6 py-3 rounded-xl font-medium text-sm transition shadow-lg shadow-cyan-500/20 disabled:opacity-50">
                    Stream
                </button>
            </div>
            <div class="flex gap-2">
                <button type="button" class="sample-prompt text-xs bg-slate-900 hover:bg-slate-800 text-slate-400 px-3 py-1.5 rounded-lg border border-slate-800 transition">
                    Explain Async vs Sync in Python
                </button>
                <button type="button" class="sample-prompt text-xs bg-slate-900 hover:bg-slate-800 text-slate-400 px-3 py-1.5 rounded-lg border border-slate-800 transition">
                    How does Redis Caching save LLM costs?
                </button>
            </div>
        </form>
    </div>

    <script>
        const form = document.getElementById('chat-form');
        const input = document.getElementById('prompt-input');
        const output = document.getElementById('output');
        const submitBtn = document.getElementById('submit-btn');
        const cacheBadge = document.getElementById('cache-badge');
        const ttftDisplay = document.getElementById('ttft-display');

        document.querySelectorAll('.sample-prompt').forEach(btn => {
            btn.addEventListener('click', () => {
                input.value = btn.innerText.trim();
                form.dispatchEvent(new Event('submit'));
            });
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const prompt = input.value.trim();
            if (!prompt) return;

            // Reset UI
            output.innerHTML = "";
            output.classList.add("cursor-blink");
            submitBtn.disabled = true;
            cacheBadge.innerText = "Querying...";
            cacheBadge.className = "text-sm font-semibold text-yellow-400";
            ttftDisplay.innerText = "Measuring...";

            const startTime = performance.now();
            let firstTokenReceived = false;

            try {
                const response = await fetch('/api/v1/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt, model: 'llama-3.1-8b-instant', temperature: 0.7 })
                });

                if (response.status === 429) {
                    output.innerText = "❌ Rate Limit Exceeded (HTTP 429). Please wait 30 seconds.";
                    cacheBadge.innerText = "Rate Limited";
                    cacheBadge.className = "text-sm font-semibold text-red-400";
                    submitBtn.disabled = false;
                    output.classList.remove("cursor-blink");
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n\n");
                    buffer = lines.pop(); // Keep incomplete chunk in buffer

                    for (const line of lines) {
                        if (line.startsWith("data: ")) {
                            const dataStr = line.replace("data: ", "").trim();
                            if (dataStr === "[DONE]") {
                                output.classList.remove("cursor-blink");
                                break;
                            }
                            try {
                                const parsed = JSON.parse(dataStr);
                                if (!firstTokenReceived) {
                                    firstTokenReceived = true;
                                    const ttft = Math.round(performance.now() - startTime);
                                    ttftDisplay.innerText = `${ttft} ms`;
                                    if (parsed.cached) {
                                        cacheBadge.innerText = "HIT (Instant)";
                                        cacheBadge.className = "text-sm font-semibold text-emerald-400";
                                    } else {
                                        cacheBadge.innerText = "MISS (Live Stream)";
                                        cacheBadge.className = "text-sm font-semibold text-cyan-400";
                                    }
                                }
                                output.textContent += parsed.token;
                                output.scrollTop = output.scrollHeight;
                            } catch (err) {
                                console.error("Parse error", err);
                            }
                        }
                    }
                }
            } catch (err) {
                output.innerText = `❌ Stream Connection Error: ${err.message}`;
            } finally {
                submitBtn.disabled = false;
                output.classList.remove("cursor-blink");
            }
        });
    </script>
</body>
</html>
